:root {
  --ui-bg: rgba(24, 28, 68, .62);
  --ui-bg-hover: rgba(40, 46, 102, .8);
  --ui-fg: #f3f0ff;
  --ui-muted: #c4bfe8;
  --ui-accent: #ffd27a;
  --ui-ring: #ffe29e;
  --sky-top: #232c66;
  --ground: #28485e;
  --ease: cubic-bezier(.4, 0, .2, 1);
}

* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: #1c2354; overflow: hidden; }
body { font-family: 'Readex Pro', 'Segoe UI', Tahoma, 'Geeza Pro', sans-serif; color: var(--ui-fg); -webkit-font-smoothing: antialiased; }

#stage { position: fixed; inset: 0; background: linear-gradient(var(--sky-top) 0 55%, var(--ground) 55% 100%); overflow: hidden; }
#stage.idle.running { cursor: none; }
#scenes { position: absolute; inset: 0; }

.scene { position: absolute; inset: 0; opacity: 0; visibility: hidden;
  transition: opacity 1s var(--ease), visibility 0s linear 1s; }
.scene.active { opacity: 1; visibility: visible; transition: opacity 1s var(--ease), visibility 0s; }
.scene.instant { transition: none; }
.reduced .scene { transition-duration: .35s, 0s; }
.scene .art { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
.scene-cloud .L-cloud, .scene-cloud .L-rim, .scene-cloud .L-bgc, .scene-cloud .L-fol, .scene-cloud .L-glow { will-change: transform, opacity; }
.scene .L-grain { pointer-events: none; }
.scene .L-curL, .scene .L-curR, .scene .L-move, .scene .L-glow2 { will-change: transform, opacity; }
.scene .L-glow2 { position: absolute; border-radius: 50%; pointer-events: none;
  background: radial-gradient(closest-side, rgba(255, 251, 233, .9), rgba(233, 236, 255, .5) 25%, rgba(185, 192, 242, .14) 60%, rgba(154, 162, 230, 0)); }
.scene-cloud .L-glow { position: absolute; border-radius: 50%; pointer-events: none;
  background: radial-gradient(closest-side, rgba(255, 251, 233, .95), rgba(233, 236, 255, .55) 25%, rgba(185, 192, 242, .16) 60%, rgba(154, 162, 230, 0)); }

/* placeholder cards (sample build only) */
.scene-placeholder { display: grid; place-items: center; background: radial-gradient(ellipse at 50% 40%, #3a4392, #1f2658 70%); }
.ph-card { display: grid; justify-items: center; gap: .4em; color: var(--ui-muted); text-align: center; }
.ph-num { font-size: clamp(40px, 7vw, 96px); font-weight: 600; color: #8f8ad0; line-height: 1; }
.ph-title { font-size: clamp(22px, 2.6vw, 38px); font-weight: 500; color: #ddd8ff; }
.ph-note { font-size: clamp(14px, 1.3vw, 18px); }

/* ---------- controls ---------- */
#controls { position: absolute; inset-inline: 0; bottom: max(14px, env(safe-area-inset-bottom)); margin-inline: auto; width: max-content; max-width: calc(100% - 24px);
  display: flex; align-items: center; gap: 6px; padding: 6px; border-radius: 999px; background: var(--ui-bg);
  backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); box-shadow: 0 6px 24px rgba(10, 12, 40, .35);
  transition: opacity .6s var(--ease), transform .6s var(--ease); z-index: 5; }
#stage.idle.running #controls { opacity: 0; transform: translateY(8px); }
#stage.idle.running #controls:focus-within { opacity: 1; transform: none; }
#controls button { appearance: none; border: 0; background: transparent; color: var(--ui-fg); font: inherit; font-size: 15px; font-weight: 500;
  display: inline-flex; align-items: center; gap: 6px; height: 40px; padding: 0 14px; border-radius: 999px; cursor: pointer; }
#controls button:hover:not(:disabled) { background: var(--ui-bg-hover); }
#controls button:disabled { opacity: .35; cursor: default; }
#controls button:focus-visible, #controls input:focus-visible, #gate button:focus-visible { outline: 3px solid var(--ui-ring); outline-offset: 2px; }
#controls svg { width: 20px; height: 20px; flex: none; }
#controls .icon-only { padding: 0; width: 40px; justify-content: center; }
#dots { display: flex; gap: 7px; padding: 0 6px; }
#dots i { width: 7px; height: 7px; border-radius: 50%; background: rgba(243, 240, 255, .35); transition: all .4s var(--ease); }
#dots i.on { width: 20px; border-radius: 4px; background: var(--ui-accent); }
.sep { width: 1px; height: 22px; background: rgba(243, 240, 255, .2); margin: 0 4px; }
#mute .x { display: none; } #mute.off .x { display: block; } #mute.off .w { display: none; }
#vol { width: 92px; accent-color: var(--ui-accent); cursor: pointer; }
@media (max-width: 640px) {
  #controls .lbl { display: none; } #controls button { padding: 0 10px; } #vol { display: none; }
}

/* ---------- start gate ---------- */
#gate { position: absolute; inset: 0; display: grid; place-items: center; z-index: 8;
  background: radial-gradient(ellipse at 50% 55%, rgba(20, 24, 64, .35), rgba(14, 16, 44, .72));
  transition: opacity .7s var(--ease); }
#gate.gone { opacity: 0; pointer-events: none; }
#gate[hidden], .still #controls, .still #toast { display: none; }
.gate-card { display: grid; justify-items: center; gap: 18px; padding: 34px 40px 28px; border-radius: 28px; text-align: center;
  background: rgba(26, 30, 74, .78); box-shadow: 0 20px 60px rgba(8, 10, 34, .45); max-width: min(520px, calc(100% - 32px)); }
.gate-card h1 { margin: 0; font-size: clamp(24px, 3vw, 34px); font-weight: 600; color: #fff; }
.gate-card p { margin: 0; font-size: 15px; line-height: 1.7; color: var(--ui-muted); }
.gate-actions { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; }
#gate button { appearance: none; border: 0; font: inherit; font-size: 17px; font-weight: 600; padding: 12px 24px; border-radius: 999px; cursor: pointer; }
#startFs { background: var(--ui-accent); color: #2a2350; }
#start { background: rgba(243, 240, 255, .14); color: var(--ui-fg); }
.gate-hint { font-size: 13px !important; opacity: .85; display: flex; flex-wrap: wrap; justify-content: center; gap: 4px 16px; }
.gate-hint span { white-space: nowrap; }
@media (max-width: 640px), (pointer: coarse) { .gate-hint { display: none; } }
kbd { font-family: inherit; font-size: 12px; padding: 1px 6px; border-radius: 6px; background: rgba(255, 255, 255, .12); }

/* ---------- toast & screen-reader text ---------- */
#toast { position: absolute; top: 16px; inset-inline: 0; margin-inline: auto; width: max-content; max-width: calc(100% - 32px);
  padding: 10px 18px; border-radius: 14px; background: rgba(24, 28, 68, .9); color: var(--ui-fg); font-size: 15px; z-index: 9;
  opacity: 0; transform: translateY(-8px); transition: opacity .4s, transform .4s; pointer-events: none; }
#toast.on { opacity: 1; transform: none; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

</style>
</head>
<body>
<main id="stage">
  <div id="scenes"></div>

  <nav id="controls" aria-label="التحكم في العرض">
    <button id="prev" type="button" aria-label="المشهد السابق" title="السابق (→ أو Page Up)">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 5l7 7-7 7" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <span class="lbl">السابق</span>
    </button>
    <div id="dots" aria-hidden="true"></div>
    <button id="next" type="button" aria-label="المشهد التالي" title="التالي (← أو Page Down)">
      <span class="lbl">التالي</span>
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>
    <span class="sep" aria-hidden="true"></span>
    <button id="mute" class="icon-only" type="button" aria-label="كتم الصوت" aria-pressed="false" title="الصوت (M)">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9.5h3.5L12 5.5v13l-4.5-4H4z" fill="currentColor"/>
        <path class="w" d="M15.5 9a4 4 0 0 1 0 6M18 6.5a7.5 7.5 0 0 1 0 11" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
        <path class="x" d="M16 9.5l5 5M21 9.5l-5 5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
    </button>
    <input id="vol" type="range" min="0" max="100" step="5" value="80" aria-label="مستوى الصوت">
    <button id="fs" type="button" aria-label="ملء الشاشة" aria-pressed="false" title="ملء الشاشة (F)">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <span class="lbl">ملء الشاشة</span>
    </button>
  </nav>

  <div id="gate">
    <div class="gate-card" role="dialog" aria-labelledby="gateTitle">
      <h1 id="gateTitle">أين اختفى القمر؟</h1>
      <div class="gate-actions">
        <button id="startFs" type="button">ابدأ بملء الشاشة</button>
        <button id="start" type="button">ابدأ</button>
      </div>
      <p>ضغطة البدء تسمح للمتصفح بتشغيل الأصوات.</p>
      <p class="gate-hint"><span>التالي: <kbd><bdi>←</bdi></kbd> أو <kbd><bdi>Page Down</bdi></kbd></span> <span>السابق: <kbd><bdi>→</bdi></kbd> أو <kbd><bdi>Page Up</bdi></kbd></span></p>
    </div>
  </div>

  <div id="toast" role="status" aria-live="polite"></div>
  <div id="live" class="sr" aria-live="polite"></div>
</main>

<script>
/* Small deterministic helpers shared by every scene. */
(function (global) {
  'use strict';
  const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);
  const easeInOut = (x) => (x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2);
  const easeOut = (x) => 1 - Math.pow(1 - x, 3);
  const smooth = (a, b, x) => { const t = clamp((x - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); };

  // seeded PRNG (mulberry32) so every playback of a scene is identical
  function rng(seed) {
    let a = seed >>> 0;
    return function () {
      a |= 0; a = (a + 0x6d2b79f5) | 0;
      let t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  const inEllipse = (x, y, cx, cy, rx, ry) => ((x - cx) / rx) ** 2 + ((y - cy) / ry) ** 2 < 1;

  // Natural, irregular blinking as a pure function of time: returns eyelid openness 0..1.
  function blinkTrack(seed, minGap, maxGap) {
    const r = rng(seed), times = [];
    let t = 1.2 + r() * 1.5;
    for (let i = 0; i < 400; i++) { times.push(t); if (r() < 0.12) times.push(t + 0.32); t += minGap + r() * (maxGap - minGap); }
    const D = 0.16;
    return function (now) {
      // binary search for the last blink start <= now
      let lo = 0, hi = times.length - 1, k = -1;
      while (lo <= hi) { const mid = (lo + hi) >> 1; if (times[mid] <= now) { k = mid; lo = mid + 1; } else hi = mid - 1; }
      if (k < 0) return 1;
      const d = now - times[k];
      if (d > D) return 1;
      return 1 - Math.sin((d / D) * Math.PI) * 0.92;
    };
  }

  // attribute writer that skips unchanged values, so still parts of a figure are never repainted
  function setter() {
    const cache = new WeakMap();
    return function (el, attr, val) {
      if (!el) return;
      let c = cache.get(el); if (!c) { c = {}; cache.set(el, c); }
      if (c[attr] === val) return;
      c[attr] = val; el.setAttribute(attr, val);
    };
  }

  function blink(el, open, cx, cy, set) {
    const v = open >= 0.999 ? '' : `translate(${cx} ${cy}) scale(1 ${open.toFixed(2)}) translate(${-cx} ${-cy})`;
    if (set) set(el, 'transform', v); else el.setAttribute('transform', v);
  }

  global.MidadMath = { clamp, easeInOut, easeOut, smooth, rng, inEllipse, blinkTrack, blink, setter };
})(window);

<script>
/* Midad — Luma & Noura, approved direction A: "picture-book gouache".
   Flat painted shapes, no outlines, one shade shape per form (light from upper-left),
   paper grain, small dot eyes, pear / column bodies, noodle limbs with round hands.
   This file is the single source of the characters for the sheet and every scene.
   Local coordinates: feet centre at (0,0), up is negative y. */
(function (global) {
  'use strict';

  const C = {
    luma: {
      skin: '#c98a64', skinSh: '#b5764f', nose: '#9c5f40', hair: '#2b2130', hairHi: '#3d3044',
      dress: '#e8705a', dressSh: '#d15a47', dressHi: '#f08a72', dots: '#f6c9a8',
      tie: '#e9b63e', shoe: '#3a2b3d', cheek: '#ef8b7b', ink: '#1d1620', mouth: '#7a2c38', tongue: '#e7837f',
    },
    noura: {
      skin: '#a96f4e', skinSh: '#935d3f', nose: '#81503a', hair: '#221a26', hairHi: '#352a3a',
      dress: '#4f8f8a', dressSh: '#3d7773', trim: '#ece2cb', clip: '#e9b63e', shoe: '#5b4a7a',
      cheek: '#e57f73', ink: '#1d1620', mouth: '#6b2a33',
    },
  };

  function defs(id) {
    id = id || 'g';
    return `
    <filter id="${id}-grain" x="-10%" y="-10%" width="120%" height="120%">
      <feTurbulence type="fractalNoise" baseFrequency=".85" numOctaves="2" seed="4" result="n"/>
      <feColorMatrix in="n" type="matrix" values=".25 0 0 0 .8  .25 0 0 0 .8  .25 0 0 0 .8  0 0 0 0 1" result="g"/>
      <feComposite in="g" in2="SourceGraphic" operator="in" result="gi"/>
      <feBlend in="SourceGraphic" in2="gi" mode="multiply"/>
    </filter>`;
  }

  // one face group per expression (scenes cross-fade between them); the first is visible
  function faces(id, o, draw) {
    const list = o.faces || [o.ex];
    return list.map((ex, i) => `<g id="${id}-face-${ex}"${i ? ' opacity="0"' : ''}>${draw(ex)}</g>`).join('');
  }

  const limb = (d, col, w) => `<path d="${d}" stroke="${col}" stroke-width="${w || 14}" stroke-linecap="round" stroke-linejoin="round" fill="none"/>`;
  const hand = (x, y, col, r) => `<circle cx="${x}" cy="${y}" r="${r || 13}" fill="${col}"/>`;

  /* ---------------- LUMA ---------------- */
  // expressions: smile | wonder | joy | aww        poses: down | point | up | clasp
  function lumaFace(c, ex, tx, ly, eid) {
    const dx = 12 * tx, ey = -318 + ly;
    const L = -30 + dx, R = 30 + dx;
    let eyes = '', brows = '', mouth = '';
    const dot = (x, y, ry) => `<ellipse cx="${x}" cy="${y}" rx="7.5" ry="${ry}" fill="${c.ink}"/><circle cx="${x + 2}" cy="${y - 4}" r="2.4" fill="#fff"/>`;
    if (ex === 'joy') {
      eyes = `<path d="M ${L - 9} ${ey + 3} Q ${L} ${ey - 9} ${L + 9} ${ey + 3} M ${R - 9} ${ey + 3} Q ${R} ${ey - 9} ${R + 9} ${ey + 3}" stroke="${c.ink}" stroke-width="4.5" stroke-linecap="round" fill="none"/>`;
      brows = `M ${L - 10} ${ey - 26} Q ${L} ${ey - 33} ${L + 10} ${ey - 28} M ${R - 10} ${ey - 28} Q ${R} ${ey - 33} ${R + 10} ${ey - 26}`;
      mouth = `<path d="M ${-17 + dx} -288 Q ${dx} -260 ${17 + dx} -288 Z" fill="${c.mouth}"/><path d="M ${-8 + dx} -275 Q ${dx} -268 ${8 + dx} -275 Q ${dx} -281 ${-8 + dx} -275 Z" fill="${c.tongue}"/>`;
    } else if (ex === 'ponder') {   // thinking: eyes up and aside, one brow lifted, small pursed mouth
      eyes = dot(L - 3, ey - 4, 10) + dot(R - 3, ey - 4, 10);
      brows = `M ${L - 10} ${ey - 30} Q ${L - 1} ${ey - 40} ${L + 9} ${ey - 32} M ${R - 9} ${ey - 24} L ${R + 10} ${ey - 22}`;
      mouth = `<ellipse cx="${dx - 6}" cy="-283" rx="6" ry="4.5" fill="${c.mouth}"/>`;
    } else if (ex === 'aww') {
      eyes = dot(L, ey + 3, 9.5) + dot(R, ey + 3, 9.5);
      brows = `M ${L - 10} ${ey - 20} Q ${L} ${ey - 26} ${L + 10} ${ey - 31} M ${R - 10} ${ey - 31} Q ${R} ${ey - 26} ${R + 10} ${ey - 20}`;
      mouth = `<path d="M ${-9 + dx} -278 Q ${dx} -286 ${9 + dx} -278" stroke="${c.mouth}" stroke-width="3.6" stroke-linecap="round" fill="none"/>`;
    } else {
      const big = ex === 'wonder';
      eyes = dot(L, ey, big ? 12 : 10.5) + dot(R, ey, big ? 12 : 10.5);
      const bh = big ? 30 : 24;
      brows = `M ${L - 10} ${ey - bh + 6} Q ${L - 1} ${ey - bh - 2} ${L + 9} ${ey - bh + 4} M ${R - 9} ${ey - bh + 4} Q ${R + 1} ${ey - bh - 2} ${R + 10} ${ey - bh + 6}`;

  function luma(id, o) {
    o = Object.assign({ pose: 'down', ex: 'smile', tx: 0, ly: 0, tilt: 0 }, o || {});
    const c = C.luma;
    let behind = '', front = '', after = '';
    const A = (d, hx, hy) => limb(d, c.skin) + hand(hx, hy, c.skin);
    const rightOut = () => A('M 48 -214 C 78 -192 100 -160 114 -134', 117, -126);
    if (o.pose === 'pointDown') {
      // pointing down and ahead at something on the ground / in the water
      behind = `<g id="${id}-armPoint">` + limb('M -42 -214 C -96 -206 -146 -172 -176 -132', c.skin) + hand(-180, -124, c.skin)
        + `<ellipse cx="-193" cy="-110" rx="5.5" ry="12" transform="rotate(42 -193 -110)" fill="${c.skin}"/></g>` + rightOut();
    } else if (o.pose === 'cheek') {
      // thinking: one hand resting on her cheek, the other arm relaxed

    } else if (o.pose === 'point') {

      behind = `<g id="${id}-armPoint">` + limb('M -40 -214 C -100 -258 -150 -328 -184 -390', c.skin) + hand(-188, -398, c.skin)
        + `<ellipse cx="-197" cy="-416" rx="5.5" ry="12" transform="rotate(-30 -197 -416)" fill="${c.skin}"/></g>`
        + A('M 48 -214 C 78 -192 100 -160 114 -134', 117, -126);
    } else if (o.pose === 'clasp') {
      front = limb('M -44 -212 C -74 -196 -60 -176 -16 -184', c.skin) + limb('M 44 -212 C 74 -196 60 -176 16 -184', c.skin)
        + hand(-9, -186, c.skin, 14) + hand(9, -186, c.skinSh, 14);
    } else { // down: arms hang slightly outward from behind the dress, hands clear of the hem
      behind = A('M -48 -214 C -78 -192 -100 -160 -114 -134', -117, -126) + A('M 48 -214 C 78 -192 100 -160 114 -134', 117, -126);
    }
    return `

      <g id="${id}-body">

        <path d="M -46 -2 C -46 -16 -30 -20 -20 -14 C -10 -10 -10 0 -18 2 Z" fill="${c.shoe}"/>
        <path d="M 24 -4 C 26 -18 44 -20 52 -12 C 58 -4 52 2 42 2 Z" fill="${c.shoe}"/>
        <g id="${id}-armsB">${behind}</g>
        <path d="M -36 -238 C -74 -228 -98 -160 -110 -110 C -114 -94 -104 -84 -88 -84 L 88 -84 C 104 -84 114 -94 110 -110 C 98 -160 74 -228 36 -238 Z" fill="${c.dress}"/>
        <path d="M 20 -236 C 60 -220 86 -160 100 -110 C 104 -96 98 -88 88 -86 L 40 -86 C 62 -130 56 -190 20 -236 Z" fill="${c.dressSh}"/>
        <path d="M -50 -228 C -66 -226 -80 -212 -84 -196 C -70 -190 -54 -196 -44 -210 Z" fill="${c.dressHi}"/>
        <path d="M 50 -228 C 66 -226 80 -212 84 -196 C 70 -190 54 -196 44 -210 Z" fill="${c.dressSh}"/>
        <g fill="${c.dots}" opacity=".85"><circle cx="-60" cy="-150" r="5"/><circle cx="-20" cy="-176" r="5"/><circle cx="18" cy="-140" r="5"/><circle cx="-40" cy="-112" r="5"/><circle cx="56" cy="-118" r="5"/><circle cx="40" cy="-190" r="5"/></g>
        <g id="${id}-armsF">${front}</g>
      </g>
      <g id="${id}-head" transform="rotate(${o.tilt} 0 -250)">
        <path d="M -96 -300 C -128 -310 -132 -360 -104 -376 C -112 -414 -74 -444 -40 -430 C -24 -462 28 -462 44 -430 C 78 -446 116 -416 106 -378 C 134 -360 128 -312 96 -300 C 80 -270 -80 -270 -96 -300 Z" fill="${c.hair}"/>
        <circle cx="-118" cy="-392" r="34" fill="${c.hair}"/><circle cx="118" cy="-392" r="34" fill="${c.hair}"/>
        <path d="M -132 -398 C -128 -408 -120 -412 -112 -410" stroke="${c.hairHi}" stroke-width="5" stroke-linecap="round" fill="none"/>

        <ellipse cx="96" cy="-378" rx="9" ry="13" transform="rotate(40 96 -378)" fill="${c.tie}"/>

        <path transform="translate(${6 * o.tx} 0)" d="M -84 -350 C -84 -384 -50 -410 -10 -406 C 30 -410 76 -394 86 -354 C 72 -362 60 -360 52 -350 C 44 -366 26 -370 14 -360 C 2 -374 -20 -374 -30 -360 C -42 -372 -62 -368 -68 -354 C -74 -360 -80 -358 -84 -350 Z" fill="${c.hair}"/>

  /* ---------------- NOURA ---------------- */
  // expressions: calm | think | gentle | surprise      poses: behind | chin | down
  function nouraFace(c, ex, tx, ly, eid) {
    const dx = 10 * tx, ey = -344 + ly;
    const L = -27 + dx, R = 27 + dx;
    const dot = (x, y, rx, ry, hl) => `<ellipse cx="${x}" cy="${y}" rx="${rx}" ry="${ry}" fill="${c.ink}"/>${hl ? `<circle cx="${x + 2}" cy="${y - 3.5}" r="2.2" fill="#fff"/>` : ''}`;
    let eyes = '', brows = '', mouth = '';
    if (ex === 'think') {          // looking up and aside, one brow raised
      eyes = dot(L + 3, ey - 3, 7, 9, true) + dot(R + 3, ey - 3, 7, 9, true);
      brows = `M ${L - 10} ${ey - 22} L ${L + 8} ${ey - 24} M ${R - 9} ${ey - 28} Q ${R} ${ey - 34} ${R + 11} ${ey - 29}`;
      mouth = `<path d="M ${-6 + dx} -305 Q ${4 + dx} -303 ${12 + dx} -306" stroke="${c.mouth}" stroke-width="3.6" stroke-linecap="round" fill="none"/>`;
    } else if (ex === 'gentle') {
      eyes = dot(L, ey, 7, 9.5, true) + dot(R, ey, 7, 9.5, true);
      brows = `M ${L - 10} ${ey - 22} Q ${L} ${ey - 26} ${L + 9} ${ey - 23} M ${R - 9} ${ey - 23} Q ${R} ${ey - 26} ${R + 10} ${ey - 22}`;
      mouth = `<path d="M ${-12 + dx} -306 Q ${dx} -296 ${12 + dx} -306" stroke="${c.mouth}" stroke-width="3.8" stroke-linecap="round" fill="none"/>`;
    } else if (ex === 'surprise') {
      eyes = dot(L, ey - 1, 7.5, 10.5, true) + dot(R, ey - 1, 7.5, 10.5, true);
      brows = `M ${L - 10} ${ey - 26} Q ${L} ${ey - 32} ${L + 9} ${ey - 28} M ${R - 9} ${ey - 28} Q ${R} ${ey - 32} ${R + 10} ${ey - 26}`;
      mouth = `<ellipse cx="${dx}" cy="-302" rx="6" ry="8" fill="${c.mouth}"/>`;
    } else {                       // calm: soft lids, glance to the side
      eyes = dot(L + 2, ey, 7, 9, false) + dot(R + 2, ey, 7, 9, false)
        + `<path d="M ${L - 11} ${ey - 6} Q ${L + 1} ${ey - 13} ${L + 13} ${ey - 6} M ${R - 11} ${ey - 6} Q ${R + 1} ${ey - 13} ${R + 13} ${ey - 6}" stroke="${c.skin}" stroke-width="7" stroke-linecap="round" fill="none"/>`
        + `<path d="M ${L - 11} ${ey - 7} Q ${L + 1} ${ey - 13} ${L + 13} ${ey - 7} M ${R - 11} ${ey - 7} Q ${R + 1} ${ey - 13} ${R + 13} ${ey - 7}" stroke="${c.ink}" stroke-width="2.6" stroke-linecap="round" fill="none"/>`;
      brows = `M ${L - 9} ${ey - 24} L ${L + 9} ${ey - 26} M ${R - 7} ${ey - 28} L ${R + 11} ${ey - 24}`;
      mouth = `<path d="M ${-10 + dx} -304 Q ${2 + dx} -298 ${12 + dx} -305" stroke="${c.mouth}" stroke-width="3.6" stroke-linecap="round" fill="none"/>`;
    }
    return `
      <circle cx="${-46 + dx * 0.6}" cy="-318" r="12" fill="${c.cheek}" opacity=".6"/><circle cx="${48 + dx * 0.6}" cy="-318" r="12" fill="${c.cheek}" opacity=".6"/>

      <path d="${brows}" stroke="${c.ink}" stroke-width="3.5" stroke-linecap="round" fill="none"/>
      <path d="M ${-5 + dx * 1.3} -328 Q ${dx * 1.3} -322 ${5 + dx * 1.3} -328" stroke="${c.nose}" stroke-width="3.2" stroke-linecap="round" fill="none"/>
      ${mouth}`;
  }

  function noura(id, o) {
    o = Object.assign({ pose: 'behind', ex: 'calm', tx: 0, ly: 0, tilt: 7 }, o || {});
    const c = C.noura;
    let behind = '', after = '';
    const A = (d, hx, hy, col) => limb(d, col || c.skin, 13) + hand(hx, hy, col || c.skin, 12);
    const out = (s) => A(`M ${s * 36} -258 C ${s * 62} -230 ${s * 82} -190 ${s * 94} -158`, s * 96, -150);
    if (o.pose === 'chin') {
      behind = out(1);
      // sleeve from the shoulder down to the elbow, then the forearm rises to the chin
      after = limb('M -42 -256 C -60 -238 -68 -210 -64 -190', c.dressSh, 17)
        + limb('M -64 -190 C -56 -204 -40 -236 -28 -262', c.skin, 13) + hand(-26, -270, c.skin, 13);
    } else if (o.pose === 'down') {
      behind = out(-1) + out(1);
    }
    return `
    <g id="${id}" class="g-noura"${o.grain === false ? '' : ` filter="url(#${o.defs || 'g'}-grain)"`}>
      <ellipse id="${id}-shadow" cx="0" cy="4" rx="70" ry="10" fill="${o.shadow || '#d9c9ae'}"/>
      <g id="${id}-body">
        ${limb('M -16 -60 L -16 -12', c.skinSh, 13)}${limb('M 16 -60 L 16 -12', c.skinSh, 13)}
        <path d="M -36 -2 C -36 -14 -22 -18 -12 -12 C -6 -8 -8 2 -14 2 Z" fill="${c.shoe}"/>
        <path d="M 12 -4 C 14 -16 30 -18 38 -10 C 42 -2 36 2 28 2 Z" fill="${c.shoe}"/>
        <g id="${id}-armsB">${behind}</g>
        <path d="M -34 -268 C -62 -262 -72 -220 -74 -170 C -76 -120 -84 -80 -86 -60 C -86 -50 -78 -46 -68 -46 L 68 -46 C 78 -46 86 -50 86 -60 C 84 -80 76 -120 74 -170 C 72 -220 62 -262 34 -268 Z" fill="${c.dress}"/>
        <path d="M 26 -266 C 56 -250 64 -210 66 -170 C 68 -120 76 -82 78 -60 C 78 -52 74 -48 68 -48 L 40 -48 C 50 -110 50 -200 26 -266 Z" fill="${c.dressSh}"/>
        <path d="M -74 -60 C -30 -54 30 -54 82 -60 L 84 -52 C 30 -44 -30 -44 -84 -52 Z" fill="${c.trim}"/>
        <path d="M -30 -266 C -30 -244 -10 -236 0 -250 C 10 -236 30 -244 30 -266 C 10 -260 -10 -260 -30 -266 Z" fill="${c.trim}"/>
        <path d="M 18 -150 L 48 -150 L 46 -122 C 40 -114 26 -114 20 -122 Z" fill="${c.dressSh}"/>
      </g>
      <g id="${id}-head" transform="rotate(${o.tilt} 0 -280)">
        <path d="M -88 -360 C -92 -420 -50 -462 0 -462 C 50 -462 92 -420 88 -360 L 92 -282 C 92 -272 84 -268 74 -270 L -74 -270 C -84 -268 -92 -272 -92 -282 Z" fill="${c.hair}"/>
        <path d="M -78 -330 L -80 -290" stroke="${c.hairHi}" stroke-width="5" stroke-linecap="round"/>
        <ellipse cx="0" cy="-352" rx="74" ry="88" fill="${c.skin}"/>
        <path d="M 34 -432 C 70 -410 82 -370 76 -330 C 70 -296 52 -276 30 -268 C 58 -300 66 -360 34 -432 Z" fill="${c.skinSh}"/>
        <path transform="translate(${5 * o.tx} 0)" d="M -80 -372 C -80 -430 -42 -456 0 -456 C 42 -456 80 -430 80 -372 C 40 -380 -40 -380 -80 -372 Z" fill="${c.hair}"/>
        <path d="M -40 -446 C -16 -454 14 -454 36 -446" stroke="${c.hairHi}" stroke-width="5" stroke-linecap="round" fill="none"/>
        <rect x="44" y="-404" width="26" height="9" rx="4.5" transform="rotate(-18 57 -400)" fill="${c.clip}"/>
        ${faces(id, o, (ex) => nouraFace(c, ex, o.tx, o.ly, `${id}-eyes-${ex}`))}
        ${o.rim ? `<path d="M -90 -330 C -92 -420 -50 -462 0 -462 C 20 -462 38 -456 52 -446" stroke="${o.rim}" stroke-width="5" stroke-linecap="round" fill="none"/>` : ''}
      </g>
      <g id="${id}-armsA">${after}</g>
    </g>`;
  }

  global.MidadGouache = { luma, noura, defs, C };
})(window);

<script>
/* Midad sound engine — every sound is synthesized live with the Web Audio API.
   Original material, no files, no licences, works offline.
   Design rules: no hiss (noise is low-passed), no rumble (high-passed), no sharp
   attacks, no continuous tones, nothing loud or sudden. */
(function (global) {
  'use strict';
  const M = global.MidadMath;

  const store = {
    get(k, d) { try { const v = localStorage.getItem(k); return v === null ? d : JSON.parse(v); } catch (e) { return d; } },
    set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) { /* storage blocked: keep in memory */ } },
  };

  function makeBrownNoise(ctx, seconds, seed) {
    const sr = ctx.sampleRate, n = Math.floor(sr * seconds), fade = Math.floor(sr * 0.5);
    const buf = ctx.createBuffer(1, n, sr), d = buf.getChannelData(0), r = M.rng(seed);
    let last = 0;
    for (let i = 0; i < n; i++) { last = (last + 0.02 * (r() * 2 - 1)) / 1.02; d[i] = last * 3.5; }
    // remove DC drift, then crossfade the tail into the head so the loop has no seam/click
    let mean = 0; for (let i = 0; i < n; i++) mean += d[i]; mean /= n;
    for (let i = 0; i < n; i++) d[i] -= mean;
    for (let i = 0; i < fade; i++) { const a = i / fade; d[i] = d[i] * a + d[n - fade + i] * (1 - a); }
    const out = ctx.createBuffer(1, n - fade, sr); out.getChannelData(0).set(d.subarray(0, n - fade));
    let peak = 0; const o = out.getChannelData(0); for (let i = 0; i < o.length; i++) peak = Math.max(peak, Math.abs(o[i]));
    for (let i = 0; i < o.length; i++) o[i] = (o[i] / peak) * 0.7;
    return out;
  }

  /* ---------- scene sound layers ---------- */
  const LAYERS = {};

  // Scene 4: a soft night breeze that breathes in slow, irregular swells,
  // a fuller sigh of air while the cloud turns, and a tiny glassy shimmer
  // when the silver light peeks out.
  LAYERS.cloud = function (ctx, out) {
    const noise = makeBrownNoise(ctx, 9, 11);
    const src = ctx.createBufferSource(); src.buffer = noise; src.loop = true;
    // two high-passes remove the low rumble that reads as "air conditioner" on hall speakers
    const hp = ctx.createBiquadFilter(); hp.type = 'highpass'; hp.frequency.value = 190; hp.Q.value = 0.6;
    const hp2 = ctx.createBiquadFilter(); hp2.type = 'highpass'; hp2.frequency.value = 160; hp2.Q.value = 0.5;
    // v2 (after "a bit annoying"): quieter, duller, and slower swells that do not pump
    const lp = ctx.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 480; lp.Q.value = 0.3;
    const gust = ctx.createGain(); gust.gain.value = 0.0;
    src.connect(hp).connect(hp2).connect(lp).connect(gust).connect(out);
    src.start();

    const r = M.rng(5);
    let timer = 0, alive = true;
    const BASE = 0.3;
    function swell() {
      if (!alive) return;
      const now = ctx.currentTime, dur = 7 + r() * 5;
      gust.gain.setTargetAtTime(BASE * (0.7 + r() * 0.3), now, dur / 2.5);
      lp.frequency.setTargetAtTime(420 + r() * 140, now, dur / 2.5);
      timer = setTimeout(swell, dur * 1000);
    }
    gust.gain.setTargetAtTime(BASE * 0.7, ctx.currentTime, 0.8);
    swell();

    function shimmer() {
      // two low, soft notes (C5, G5): slow bloom, long quiet fade, no bright partials
      const now = ctx.currentTime;
      const bus = ctx.createGain(); bus.gain.value = 1;
      const tone = ctx.createBiquadFilter(); tone.type = 'lowpass'; tone.frequency.value = 1600;
      bus.connect(tone).connect(out);
      [[523.25, 0, 0.016], [783.99, 0.3, 0.011]].forEach(([f, off, peak]) => {
        [1, 2.0].forEach((mult, j) => {
          const o = ctx.createOscillator(); o.type = 'sine'; o.frequency.value = f * mult;
          o.detune.value = j ? 4 : 0;
          const g = ctx.createGain(); const p = peak * (j ? 0.06 : 1);
          g.gain.setValueAtTime(0.0001, now + off);
          g.gain.exponentialRampToValueAtTime(p, now + off + 0.35);
          g.gain.exponentialRampToValueAtTime(0.0001, now + off + 3.2);
          o.connect(g).connect(bus); o.start(now + off); o.stop(now + off + 3.4);
        });
      });
      setTimeout(() => { try { bus.disconnect(); } catch (e) {} }, 4200);
    }

    function sigh() {
      // the cloud turning over: the breeze opens up gently, then settles
      const now = ctx.currentTime;
      gust.gain.cancelScheduledValues(now); lp.frequency.cancelScheduledValues(now);
      gust.gain.setTargetAtTime(BASE * 0.95, now, 1.4);
      lp.frequency.setTargetAtTime(640, now, 1.4);
      clearTimeout(timer); timer = setTimeout(swell, 3200);
    }

    return {
      cue(name) { if (!alive) return; if (name === 'turn') sigh(); if (name === 'light') shimmer(); },
      stop() { alive = false; clearTimeout(timer); try { src.stop(ctx.currentTime + 0.05); } catch (e) {} },
    };
  };

  /* ---- shared building blocks for the other scenes (same gentle character as scene 4) ---- */
  // a muffled breeze bed; puff() opens it a little (curtains / leaves), then it settles
  function breeze(ctx, out, o) {
    const src = ctx.createBufferSource(); src.buffer = makeBrownNoise(ctx, 9, o.seed || 11); src.loop = true;
    const hp = ctx.createBiquadFilter(); hp.type = 'highpass'; hp.frequency.value = 190; hp.Q.value = 0.6;
    const hp2 = ctx.createBiquadFilter(); hp2.type = 'highpass'; hp2.frequency.value = 160; hp2.Q.value = 0.5;
    const lp = ctx.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = o.lp || 460; lp.Q.value = 0.3;
    const g = ctx.createGain(); g.gain.value = 0;
    src.connect(hp).connect(hp2).connect(lp).connect(g).connect(out); src.start();
    const r = M.rng(o.seed || 5), base = o.level; let timer = 0, alive = true;
    function swell() {
      if (!alive) return;
      const now = ctx.currentTime, dur = 7 + r() * 5;
      g.gain.setTargetAtTime(base * (0.7 + r() * 0.3), now, dur / 2.5);
      lp.frequency.setTargetAtTime((o.lp || 460) - 40 + r() * 120, now, dur / 2.5);
      timer = setTimeout(swell, dur * 1000);
    }
    g.gain.setTargetAtTime(base * 0.8, ctx.currentTime, 0.8); swell();
    return {
      puff() {
        if (!alive) return; const now = ctx.currentTime;
        g.gain.cancelScheduledValues(now); lp.frequency.cancelScheduledValues(now);
        g.gain.setTargetAtTime(base * 1.25, now, 0.9); lp.frequency.setTargetAtTime((o.lp || 460) + 160, now, 0.9);
        clearTimeout(timer); timer = setTimeout(swell, 3000);
      },
      stop() { alive = false; clearTimeout(timer); try { src.stop(ctx.currentTime + 0.05); } catch (e) {} },
    };
  }

  // calm water: a band of filtered noise whose level breathes slowly, like small lapping waves
  function water(ctx, out, o) {
    const src = ctx.createBufferSource(); src.buffer = makeBrownNoise(ctx, 8, 23); src.loop = true;
    const bp = ctx.createBiquadFilter(); bp.type = 'bandpass'; bp.frequency.value = 520; bp.Q.value = 0.8;
    const lp = ctx.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 1100;
    const g = ctx.createGain(); g.gain.value = 0;
    const lfo = ctx.createOscillator(); lfo.frequency.value = 0.22;
    const depth = ctx.createGain(); depth.gain.value = o.level * 0.35;
    lfo.connect(depth).connect(g.gain); lfo.start();
    src.connect(bp).connect(lp).connect(g).connect(out); src.start();
    g.gain.setTargetAtTime(o.level, ctx.currentTime, 1.0);
    return {
      lap() {   // one slightly fuller, slow wave (paired with a visible ripple)
        const now = ctx.currentTime;
        bp.frequency.cancelScheduledValues(now);
        bp.frequency.setTargetAtTime(640, now, 0.6); bp.frequency.setTargetAtTime(520, now + 1.6, 1.0);
      },
      stop() { try { src.stop(ctx.currentTime + 0.05); lfo.stop(ctx.currentTime + 0.05); } catch (e) {} },
    };
  }

  // a short, soft, friendly owl call: two low "hoo"s, rounded, never shrill
  function hoot(ctx, out) {
    const now = ctx.currentTime, bus = ctx.createGain(), lp = ctx.createBiquadFilter();
    lp.type = 'lowpass'; lp.frequency.value = 900; bus.gain.value = 1; bus.connect(lp).connect(out);
    [[0, 410, 0.045, 0.55], [0.62, 380, 0.04, 0.7]].forEach(([off, f, peak, len]) => {
      const o = ctx.createOscillator(); o.type = 'sine';
      o.frequency.setValueAtTime(f * 1.04, now + off); o.frequency.exponentialRampToValueAtTime(f, now + off + 0.12);
      o.frequency.exponentialRampToValueAtTime(f * 0.94, now + off + len);
      const vib = ctx.createOscillator(), vg = ctx.createGain(); vib.frequency.value = 6; vg.gain.value = 3;
      vib.connect(vg).connect(o.frequency);
      const g = ctx.createGain();
      g.gain.setValueAtTime(0.0001, now + off); g.gain.exponentialRampToValueAtTime(peak, now + off + 0.09);
      g.gain.setTargetAtTime(peak * 0.8, now + off + 0.12, 0.1); g.gain.exponentialRampToValueAtTime(0.0001, now + off + len);
      o.connect(g).connect(bus); o.start(now + off); vib.start(now + off); o.stop(now + off + len + 0.05); vib.stop(now + off + len + 0.05);
    });
    setTimeout(() => { try { bus.disconnect(); } catch (e) {} }, 2200);
  }

  // Scene 1: quiet room; the breeze comes through the window when the curtains move
  LAYERS.window = function (ctx, out) {
    const b = breeze(ctx, out, { level: 0.2, lp: 420, seed: 3 });
    return { cue(n) { if (n === 'gust') b.puff(); }, stop() { b.stop(); } };
  };
  // Scene 2: garden breeze through leaves + a rare friendly owl call
  LAYERS.search = function (ctx, out) {
    const b = breeze(ctx, out, { level: 0.26, lp: 500, seed: 7 });
    let alive = true;
    return { cue(n) { if (alive && n === 'hoot') hoot(ctx, out); }, stop() { alive = false; b.stop(); } };
  };
  // Scene 3: calm water, a slow fuller wave with each visible ripple, a whisper of breeze
  LAYERS.pond = function (ctx, out) {
    const w = water(ctx, out, { level: 0.16 }), b = breeze(ctx, out, { level: 0.1, lp: 420, seed: 9 });
    return { cue(n) { if (n === 'ripple') w.lap(); }, stop() { w.stop(); b.stop(); } };
  };
  // Scene 5: the calmest mix — faint water and faint breeze, nothing that draws attention
  LAYERS.truth = function (ctx, out) {
    const w = water(ctx, out, { level: 0.1 }), b = breeze(ctx, out, { level: 0.14, lp: 420, seed: 13 });
    return { cue() {}, stop() { w.stop(); b.stop(); } };
  };

  // Scene 6: the same calm bed as scene 5, and one soft, warm three-note chime when the moon appears
  LAYERS.ending = function (ctx, out) {
    const w = water(ctx, out, { level: 0.11 }), b = breeze(ctx, out, { level: 0.14, lp: 420, seed: 17 });
    let alive = true;
    function chime() {
      const now = ctx.currentTime, bus = ctx.createGain(), tone = ctx.createBiquadFilter();
      tone.type = 'lowpass'; tone.frequency.value = 1700; bus.gain.value = 1; bus.connect(tone).connect(out);
      [[523.25, 0, 0.018], [659.25, 0.34, 0.014], [783.99, 0.68, 0.012]].forEach(([f, off, peak]) => {
        const o = ctx.createOscillator(); o.type = 'sine'; o.frequency.value = f;
        const g = ctx.createGain();
        g.gain.setValueAtTime(0.0001, now + off); g.gain.exponentialRampToValueAtTime(peak, now + off + 0.4);
        g.gain.exponentialRampToValueAtTime(0.0001, now + off + 4.2);
        o.connect(g).connect(bus); o.start(now + off); o.stop(now + off + 4.4);
      });
      setTimeout(() => { try { bus.disconnect(); } catch (e) {} }, 5600);
    }
    return { cue(n) { if (alive && n === 'reveal') chime(); }, stop() { alive = false; w.stop(); b.stop(); } };
  };

  // neutral layer (fallback)
  LAYERS.silent = function () { return { cue() {}, stop() {} }; };

  /* ---------- engine ---------- */
  function Engine() {
    this.ctx = null; this.master = null; this.current = null;
    this.muted = store.get('midad.muted', false);
    this.volume = store.get('midad.volume', 0.8);
  }
  Engine.prototype.unlock = function () {
    if (!this.ctx) {
      const AC = global.AudioContext || global.webkitAudioContext;
      if (!AC) return false;
      this.ctx = new AC();
      this.master = this.ctx.createGain();
      const comp = this.ctx.createDynamicsCompressor(); // gentle safety limiter
      comp.threshold.value = -18; comp.ratio.value = 3; comp.attack.value = 0.02; comp.release.value = 0.4;
      this.master.connect(comp).connect(this.ctx.destination);
      this._applyLevel(true);
    }
    if (this.ctx.state === 'suspended') this.ctx.resume();
    return true;
  };
  Engine.prototype.level = function () { return this.muted ? 0 : Math.pow(this.volume, 1.6) * 0.9; };
  Engine.prototype._applyLevel = function (instant) {
    if (!this.master) return;
    const g = this.master.gain, now = this.ctx.currentTime;
    g.cancelScheduledValues(now);
    if (instant) g.setValueAtTime(this.level(), now); else g.setTargetAtTime(this.level(), now, 0.08);
  };
  Engine.prototype.setMuted = function (m) { this.muted = !!m; store.set('midad.muted', this.muted); this._applyLevel(); };
  Engine.prototype.setVolume = function (v) { this.volume = M.clamp(v, 0, 1); store.set('midad.volume', this.volume); this._applyLevel(); };

  // Start a scene's sound bed (fading in) and fade out + dispose whatever was playing.
  Engine.prototype.play = function (layerName) {
    this.stop();
    if (!this.ctx) return;
    const ctx = this.ctx, bus = ctx.createGain();
    bus.gain.setValueAtTime(0, ctx.currentTime);
    bus.gain.linearRampToValueAtTime(1, ctx.currentTime + 1.6);
    bus.connect(this.master);
    const layer = (LAYERS[layerName] || LAYERS.silent)(ctx, bus);
    this.current = { bus, layer };
  };
  Engine.prototype.stop = function () {
    const cur = this.current; this.current = null;
    if (!cur || !this.ctx) return;
    const ctx = this.ctx, now = ctx.currentTime;
    cur.bus.gain.cancelScheduledValues(now);
    cur.bus.gain.setValueAtTime(cur.bus.gain.value, now);
    cur.bus.gain.linearRampToValueAtTime(0, now + 0.6);
    cur.layer.stop && setTimeout(() => { cur.layer.stop(); try { cur.bus.disconnect(); } catch (e) {} }, 700);
  };
  Engine.prototype.cue = function (name) { if (this.current) this.current.layer.cue(name); };
  Engine.prototype.suspend = function () { if (this.ctx && this.ctx.state === 'running') this.ctx.suspend(); };
  Engine.prototype.resume = function () { if (this.ctx && this.ctx.state === 'suspended') this.ctx.resume(); };

  global.MidadAudio = { Engine, LAYERS, makeBrownNoise };
})(window);

<script>
/* Midad — shared gouache art kit for the scenes (approved style A).
   Flat shapes, one shade shape per form, light from the upper left, no outlines,
   paper grain as one static overlay. Also holds the shared girls' rig. */
(function (global) {
  'use strict';
  const M = global.MidadMath;

  const PAL = {
    skyTop: '#232a62', skyMid: '#323b80', skyLow: '#4f5099', skyHorizon: '#6a5fa6',
    puff: '#4d5199', puffSh: '#43468a', star: '#f3eedd', starBig: '#fbf0c9',
    cloud: '#ebe7f7', cloudSh: '#cbc4e8', cloudHi: '#f8f6fd', cloudInk: '#5a5190', cloudCheek: '#f2a9c0',
    hillFar: '#4a4a8e', hillMid: '#3b5a8c', ground: '#3f787e', groundLow: '#376b72', bush: '#33666f',
    tuft: '#2c5f68', tuft2: '#33696f', trunk: '#4a3858', trunkSh: '#3e2f4c',
    leaf: '#2f4f7e', leafSh: '#284470', leafHi: '#3c6196',
    water: '#2f4f86', waterSh: '#27406f', waterHi: '#4a6aa6', bank: '#355f6a',
    silver: '#eef0ff', rim: '#7d7fc4', shadow: '#2b5560', gold: '#e9b63e', coral: '#e8705a', pink: '#ef9b8c',
  };

  const SVG = (cls, body, defs) => `<svg class="art ${cls}" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" preserveAspectRatio="xMidYMid meet" aria-hidden="true" focusable="false">${defs ? `<defs>${defs}</defs>` : ''}${body}</svg>`;

  const skyGrad = (id) => `<linearGradient id="${id}" x1="0" y1="-360" x2="0" y2="980" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="${PAL.skyTop}"/><stop offset=".45" stop-color="${PAL.skyMid}"/><stop offset=".8" stop-color="${PAL.skyLow}"/><stop offset="1" stop-color="${PAL.skyHorizon}"/></linearGradient>`;

  function stars(seed, n, avoid, box) {
    const rnd = M.rng(seed), b = box || [-380, -340, 2680, 960];
    let s = '', k = 0, guard = 0;
    while (k < n && guard++ < 5000) {
      const x = b[0] + rnd() * b[2], y = b[1] + rnd() * b[3];
      if (avoid && avoid(x, y)) continue;
      const big = rnd() < 0.16, o = (0.5 + rnd() * 0.45).toFixed(2);
      if (big) {
        const r = 9 + rnd() * 4;
        s += `<path opacity="${o}" transform="translate(${x.toFixed(1)} ${y.toFixed(1)})" fill="${PAL.starBig}" d="M 0 ${-r} Q 1.5 -1.5 ${r} 0 Q 1.5 1.5 0 ${r} Q -1.5 1.5 ${-r} 0 Q -1.5 -1.5 0 ${-r} Z"/>`;
      } else s += `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="${(1.8 + rnd() * 1.8).toFixed(1)}" fill="${PAL.star}" opacity="${o}"/>`;
      k++;
    }
    return s;
  }

  function puff(cx, cy, w, h, body, shade) {
    body = body || PAL.puff; shade = shade || PAL.puffSh;
    const p = `M ${-w * .5} ${h * .28} C ${-w * .58} ${h * .28} ${-w * .6} ${-h * .1} ${-w * .4} ${-h * .12} C ${-w * .38} ${-h * .5} ${-w * .1} ${-h * .62} ${w * .02} ${-h * .38} C ${w * .12} ${-h * .66} ${w * .42} ${-h * .5} ${w * .38} ${-h * .14} C ${w * .58} ${-h * .14} ${w * .62} ${h * .28} ${w * .46} ${h * .28} Z`;
    return `<g transform="translate(${cx} ${cy})"><path d="${p}" fill="${body}"/><path d="M ${-w * .5} ${h * .28} L ${w * .46} ${h * .28} C ${w * .5} ${h * .16} ${w * .2} ${h * .1} 0 ${h * .12} C ${-w * .2} ${h * .14} ${-w * .46} ${h * .16} ${-w * .5} ${h * .28} Z" fill="${shade}"/></g>`;
  }

  const tuft = (x, y, s, col) => `<path transform="translate(${x} ${y}) scale(${s})" d="M -18 0 C -20 -14 -24 -24 -32 -32 C -18 -26 -12 -16 -8 -6 C -8 -20 -6 -34 0 -44 C 4 -32 6 -18 6 -6 C 10 -16 18 -26 30 -30 C 22 -22 18 -12 18 0 Z" fill="${col || PAL.tuft}"/>`;
  function flower(x, y, s, petal, core) {
    let p = '';
    for (let i = 0; i < 5; i++) p += `<ellipse cx="0" cy="-7" rx="5.5" ry="7.5" transform="rotate(${i * 72})" fill="${petal}"/>`;
    return `<g transform="translate(${x} ${y}) scale(${s})"><path d="M 0 4 C 1 14 0 24 -2 32" stroke="#2c5a60" stroke-width="3.5" fill="none" stroke-linecap="round"/>${p}<circle r="4.5" fill="${core}"/></g>`;
  }

  /* --- the sleepy cloud (same character in every scene) --- */
  const CLOUD_PATH = 'M -360 112 C -428 112 -450 28 -394 -6 C -426 -86 -334 -148 -262 -114 C -250 -206 -128 -236 -68 -172 C -28 -258 126 -264 164 -172 C 214 -226 336 -204 336 -112 C 418 -124 462 -18 404 32 C 446 84 404 146 332 140 C 196 170 -196 172 -360 112 Z';
  const CLOUD_SHADE = 'M -380 70 C -250 110 -60 118 120 96 C 260 80 360 40 416 -4 C 440 40 430 110 332 140 C 196 170 -196 172 -360 112 C -380 104 -386 88 -380 70 Z';
  const CLOUD_LIGHT = 'M -330 -60 C -300 -110 -250 -110 -230 -80 C -200 -170 -110 -200 -60 -150 C -30 -220 90 -226 130 -160 C 70 -150 0 -120 -60 -110 C -150 -96 -250 -80 -330 -60 Z';
  function sleepyCloud(p, x, y, s) {
    return `<g transform="translate(${x} ${y}) scale(${s})">
        <path d="${CLOUD_PATH}" fill="${PAL.cloud}"/>
        <g clip-path="url(#${p}-clip)"><path d="${CLOUD_SHADE}" fill="${PAL.cloudSh}"/><path d="${CLOUD_LIGHT}" fill="${PAL.cloudHi}"/></g>
        <g transform="translate(-30 -2) scale(1.15)">
          <circle cx="-118" cy="46" r="24" fill="${PAL.cloudCheek}" opacity=".8"/><circle cx="118" cy="46" r="24" fill="${PAL.cloudCheek}" opacity=".8"/>
          <path d="M -104 6 Q -78 30 -52 6 M 52 6 Q 78 30 104 6" fill="none" stroke="${PAL.cloudInk}" stroke-width="9" stroke-linecap="round"/>
          <ellipse cx="0" cy="62" rx="12" ry="9" fill="${PAL.cloudInk}"/>
        </g>
      </g>`;
  }
  const cloudDefs = (p) => `<clipPath id="${p}-clip"><path d="${CLOUD_PATH}"/></clipPath>`;
  const cloudRim = (p, x, y, s, mx, my) => `<g transform="translate(${x} ${y}) scale(${s})"><path d="${CLOUD_PATH}" fill="none" stroke="url(#${p}-rimPaint)" stroke-width="12" stroke-linejoin="round"/></g>`;
  const rimDefs = (p, cx, cy, r) => `<radialGradient id="${p}-rimPaint" cx="${cx}" cy="${cy}" r="${r || 320}" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#fffbea"/><stop offset=".55" stop-color="#fffbea" stop-opacity=".55"/><stop offset="1" stop-color="#fffbea" stop-opacity="0"/></radialGradient>`;

  /* --- pond: flat water, a darker inner shade, a lighter band, and a grassy bank --- */
  function pond(cx, cy, rx, ry) {
    return `<ellipse cx="${cx}" cy="${cy + 10}" rx="${rx + 34}" ry="${ry + 22}" fill="${PAL.bank}"/>
      <ellipse cx="${cx}" cy="${cy}" rx="${rx}" ry="${ry}" fill="${PAL.water}"/>
      <path d="M ${cx - rx * .96} ${cy + ry * .1} C ${cx - rx * .6} ${cy + ry * .9} ${cx + rx * .6} ${cy + ry * .9} ${cx + rx * .96} ${cy + ry * .1} C ${cx + rx * .9} ${cy + ry * .7} ${cx + rx * .4} ${cy + ry} ${cx} ${cy + ry} C ${cx - rx * .4} ${cy + ry} ${cx - rx * .9} ${cy + ry * .7} ${cx - rx * .96} ${cy + ry * .1} Z" fill="${PAL.waterSh}"/>
      <path d="M ${cx - rx * .7} ${cy - ry * .55} C ${cx - rx * .3} ${cy - ry * .78} ${cx + rx * .3} ${cy - ry * .78} ${cx + rx * .7} ${cy - ry * .55}" stroke="${PAL.waterHi}" stroke-width="${Math.max(3, ry * .05)}" stroke-linecap="round" fill="none" opacity=".7"/>`;
  }
  function lily(x, y, s) {
    return `<g transform="translate(${x} ${y}) scale(${s})"><path d="M 0 0 L 30 -6 A 32 14 0 1 1 26 8 Z" fill="#3f8a78"/><path d="M 0 0 L 26 8 A 32 14 0 0 1 -30 4 Z" fill="#357866"/></g>`;
  }
  function reeds(x, y, s, n, seed) {
    const r = M.rng(seed || 3); let out = '';
    for (let i = 0; i < n; i++) {
      const dx = (i - n / 2) * 14 + r() * 8, h = 120 + r() * 80, lean = (r() - .5) * 30;

      <path d="M -400 790 L 2320 790" stroke="#5d4870" stroke-width="6"/>

      <g fill="#e08470"><circle cx="1480" cy="996" r="7"/><circle cx="1580" cy="978" r="7"/><circle cx="1760" cy="1016" r="7"/><circle cx="1860" cy="990" r="7"/></g>`, `

  const layerBed = () => A.SVG('L-bed', `

      <rect x="84" y="700" width="102" height="10" rx="5" fill="#4e3a5c"/>

      <!-- bed: headboard, mattress, pillow, folded blanket, footboard -->
      <path d="M 228 900 L 228 600 C 228 560 252 540 286 540 C 320 540 344 560 344 600 L 344 900 Z" fill="#7a5a86"/>

      <rect x="236" y="868" width="20" height="62" rx="6" fill="#5a4468"/><rect x="636" y="868" width="20" height="62" rx="6" fill="#5a4468"/>
      <rect x="250" y="752" width="420" height="120" rx="20" fill="#ece2cb"/>
      <path d="M 358 696 C 340 690 330 706 334 724 C 338 744 360 752 400 752 L 470 752 C 500 752 512 740 508 720 C 504 700 486 692 460 694 Z" fill="#fff8ec"/>
      <path d="M 470 752 C 500 752 512 740 508 720 C 506 712 500 704 492 700 C 496 724 486 742 452 752 Z" fill="#e3d6bc"/>
      <path d="M 452 742 C 520 726 600 730 664 744 L 690 760 L 690 872 C 600 892 470 892 400 880 C 420 840 430 790 452 742 Z" fill="#4f8f8a"/>
      <path d="M 452 742 C 470 760 488 774 520 780 C 600 794 660 780 690 766 L 690 760 L 664 744 C 600 730 520 726 452 742 Z" fill="#6aa9a2"/>
      <path d="M 620 760 C 660 770 680 790 690 820 L 690 872 C 670 878 650 882 626 884 C 640 840 640 800 620 760 Z" fill="#3d7773"/>
      <g fill="#e7dcc4" opacity=".9"><circle cx="520" cy="820" r="6"/><circle cx="580" cy="850" r="6"/><circle cx="640" cy="812" r="6"/><circle cx="470" cy="850" r="6"/></g>
      <path d="M 640 690 C 640 670 668 662 680 676 L 694 690 L 694 900 L 640 900 Z" fill="#7a5a86"/>
      <path d="M 676 676 L 694 690 L 694 900 L 676 900 Z" fill="#684a74"/>`);

  const layerPaneL = () => A.SVG('L-move L-paneL', pane(W.x0 + 8, MID));
  const layerPaneR = () => A.SVG('L-move L-paneR', pane(MID, W.x1 - 8));

  const layerCurtainR = () => A.SVG('L-curR', curtain(W.x1 + 100, -150, true) + `<path d="M ${W.x0 - 110} 96 L ${W.x1 + 110} 96" stroke="#c9a14a" stroke-width="12" stroke-linecap="round"/><circle cx="${W.x0 - 114}" cy="96" r="13" fill="#c9a14a"/><circle cx="${W.x1 + 114}" cy="96" r="13" fill="#c9a14a"/>`);
  const TW = [[W.x0 + 90, 200, 11], [W.x0 + 270, 160, 9], [W.x0 + 430, 250, 10], [W.x1 - 70, 190, 8], [W.x0 + 160, 330, 8], [W.x1 - 120, 330, 9]];
  const layerTwinkle = () => A.SVG('L-tw', TW.map(([x, y, r], i) => `<path id="w-tw${i}" transform="translate(${x} ${y})" fill="${P.starBig}" d="M 0 ${-r} Q 1.5 -1.5 ${r} 0 Q 1.5 1.5 0 ${r} Q -1.5 1.5 ${-r} 0 Q -1.5 -1.5 0 ${-r} Z"/>`).join(''));

  const layerGirls = () => A.SVG('L-girls', `
      <g transform="translate(${NOURA.x} ${NOURA.y})">${G.noura('w-nr', { pose: 'behind', faces: ['calm', 'think'], tx: -0.9, ly: -6, tilt: -8, grain: false, shadow: '#9b4a3f', rim: P.rim })}</g>

    q('w-lm-armsB').insertAdjacentHTML('afterbegin', `<g id="w-lm-armDown"><path d="M -48 -214 C -78 -192 -100 -160 -114 -134" stroke="${G.C.luma.skin}" stroke-width="14" stroke-linecap="round" fill="none"/><circle cx="-117" cy="-126" r="13" fill="${G.C.luma.skin}"/></g>`);

    let cueCb = null, lastGust = -1, opened = false;

    function gust(t) {
      const c = t % 75; let g = 0, k = -1;
      GUSTS.forEach((s, i) => { const d = c - s; if (d >= 0 && d < 5) { g = Math.sin((d / 5) * Math.PI); k = i + Math.floor(t / 75) * GUSTS.length; } });

    }

    function render(t, reduced) {
      const m = reduced ? 0 : 1;

      if (!opened && t >= OPEN_START + 0.2) { opened = true; cueCb && cueCb('open'); }

  const layerLand = () => SVG('L-land', `
      <path d="M -400 760 C -120 706 190 694 520 722 C 800 746 1010 702 1310 690 C 1610 680 1910 724 2320 700 L 2320 1440 L -400 1440 Z" fill="#4a4a8e"/>
      <g transform="translate(560 716)">
        <ellipse cx="0" cy="-24" rx="70" ry="54" fill="url(#c-win)"/>
        <path d="M -34 6 L -34 -30 L 0 -58 L 34 -30 L 34 6 Z" fill="#3a3a78"/>
        <path d="M 0 -58 L 34 -30 L 34 6 L 14 6 L 14 -40 Z" fill="#32326c"/>
        <path d="M -44 -26 L 0 -64 L 44 -26 L 38 -20 L 0 -52 L -38 -20 Z" fill="#2e2e66"/>
        <rect x="-13" y="-28" width="22" height="22" rx="5" fill="#f5c46a"/>
      </g>
      <path d="M -400 842 C -20 800 380 806 760 832 C 1100 856 1480 802 2320 790 L 2320 1440 L -400 1440 Z" fill="#3b5a8c"/>
      <path d="M -60 1010 C -44 900 -20 770 -26 650 L 30 650 C 34 770 52 900 82 1010 Z" fill="#4a3858"/>
      <path d="M 10 650 L 30 650 C 34 770 52 900 82 1010 L 46 1010 C 34 900 22 770 10 650 Z" fill="#3e2f4c"/>
      <path d="M -400 936 C 0 904 480 896 900 916 C 1260 934 1520 896 2320 878 L 2320 1440 L -400 1440 Z" fill="#3f787e"/>
      <path d="M -400 1010 C 200 980 800 990 1300 1010 C 1700 1026 2000 1000 2320 990 L 2320 1440 L -400 1440 Z" fill="#376b72"/>
      <path d="M 1010 932 C 1000 894 1040 872 1068 888 C 1082 860 1130 860 1140 892 C 1170 886 1188 914 1176 936 Z" fill="#33666f"/>
      <path d="M 1100 936 C 1120 920 1150 910 1176 936 Z" fill="#2c5961"/>

      ${tuft(120, 1060, 1.3, '#2c5f68')}${tuft(190, 1072, 1.0, '#33696f')}${tuft(330, 1050, .9, '#2c5f68')}

  const layerFoliage = () => SVG('L-fol', `

      <path d="M 56 310 C 118 252 238 286 246 378 C 318 394 340 486 286 530 C 338 588 304 684 218 690 C 180 742 76 750 32 708 C 120 690 220 640 240 560 C 260 480 200 380 56 310 Z" fill="#284470"/>

      <path d="M 40 520 C 70 480 130 486 150 520 C 120 512 80 512 40 520 Z M -150 620 C -130 590 -80 592 -66 620 C -90 612 -126 612 -150 620 Z" fill="#3c6196"/>`);

  const layerGirls = () => SVG('L-girls', `
      <g transform="translate(${NOURA.x} ${NOURA.y}) scale(${NOURA.s})">${G.noura('nr', { pose: 'chin', faces: ['think', 'gentle'], tx: -0.9, ly: -3, tilt: -6, grain: false, shadow: '#2b5560', rim: RIM })}</g>
      <g transform="translate(${LUMA.x} ${LUMA.y}) scale(${LUMA.s})">${G.luma('lm', { pose: 'point', faces: ['smile', 'wonder', 'aww'], tx: -0.9, ly: -4, tilt: -5, grain: false, shadow: '#2b5560', rim: RIM })}</g>`);

  // one static sheet of paper grain over the whole picture (rasterised once)
  const layerGrain = () => SVG('L-grain', `<rect x="-400" y="-360" width="2720" height="1800" filter="url(#c-paper)"/>`, `
      <filter id="c-paper" x="0" y="0" width="100%" height="100%">

        <feColorMatrix values="0 0 0 0 .06  0 0 0 0 .04  0 0 0 0 .1  0 0 0 -.45 .26"/>
      </filter>`);

  /* ------------- animation rig ------------- */
  function create() {
    const el = document.createElement('section');
    el.className = 'scene scene-cloud';
    el.dataset.id = 'cloud';
    el.setAttribute('aria-label', 'المشهد الرابع: السر خلف الغيوم');
    el.innerHTML = layerSky() + '<div class="L-glow"></div>' + layerBgClouds() + layerCloud() + layerRim() + layerLand() + layerFoliage() + layerGirls() + layerGrain();
    const q = (id) => el.querySelector('#' + id);
    const N = {
      glow: el.querySelector('.L-glow'), bgc: el.querySelector('.L-bgc'), cloud: el.querySelector('.L-cloud'),
      rim: el.querySelector('.L-rim'), fol: el.querySelector('.L-fol'),
      eyeL: q('c-eyeL'), eyeR: q('c-eyeR'), mouth: q('c-mouth'), smile: q('c-smile'),
      lm: { body: q('lm-body'), head: q('lm-head'), arm: q('lm-armPoint'), shadow: q('lm-shadow'),
        fSmile: q('lm-face-smile'), fWonder: q('lm-face-wonder'), fAww: q('lm-face-aww'),
        eyes: ['smile', 'wonder', 'aww'].map((e) => q('lm-eyes-' + e)) },
      nr: { body: q('nr-body'), head: q('nr-head'), arm: q('nr-armsA'),
        fThink: q('nr-face-think'), fGentle: q('nr-face-gentle'),
        eyes: ['think', 'gentle'].map((e) => q('nr-eyes-' + e)) },
    };
    const set = M.setter();
    const blinkL = M.blinkTrack(7, 2.8, 5.6), blinkN = M.blinkTrack(19, 3.6, 6.4);
    let turnIdx = -1, sighIdx = -1, cueCb = null, P = null;

    function layout(map) {
      P = map;
      const c = map.pt(CLOUD.x, CLOUD.y), t = map.pt(TRUNK.x, TRUNK.y), m = map.pt(MOON.x, MOON.y);
      N.cloud.style.transformOrigin = N.rim.style.transformOrigin = `${c[0]}px ${c[1]}px`;
      N.fol.style.transformOrigin = `${t[0]}px ${t[1]}px`;
      const gw = 1040 * map.k, gh = 880 * map.k;
      Object.assign(N.glow.style, { left: `${m[0] - gw / 2}px`, top: `${m[1] - gh / 2}px`, width: `${gw}px`, height: `${gh}px` });
    }

    function turnState(t) {
      if (t < FIRST_TURN) return { k: -1, p: -1, since: Infinity };
      let s = FIRST_TURN, k = 0;
      for (;;) {
        if (t < s + TURN_DUR) return { k, p: (t - s) / TURN_DUR, since: Infinity };
        const nx = s + GAPS[k % GAPS.length];
        if (t < nx) return { k, p: -1, since: t - (s + TURN_DUR) };
        s = nx; k++;
      }
    }
    function turnShape(p) {
      if (p < 0) return { u: 0, sq: 0, scrunch: 0 };
      const e = M.easeInOut;
      let u = 0, sq = 0;
      if (p < 0.1) sq = Math.sin((p / 0.1) * Math.PI) * 0.6;
      else if (p < 0.38) { u = e((p - 0.1) / 0.28); sq = Math.sin(((p - 0.1) / 0.28) * Math.PI) * 0.5; }
      else if (p < 0.64) u = 1;
      else { const v = (p - 0.64) / 0.36; u = 1 - e(v); sq = Math.sin(v * Math.PI) * 0.4; }
      return { u, sq, scrunch: M.smooth(0.08, 0.3, p) * (1 - M.smooth(0.7, 0.95, p)) };
    }

    function render(t, reduced) {
      const m = reduced ? 0 : 1, k = P ? P.k : 1;
      const ent = M.easeOut(M.clamp(t / 2.2, 0, 1));
      const ts = turnState(t), sh = turnShape(ts.p), L = sh.u;
      if (ts.k !== sighIdx && ts.p >= 0.04 && ts.p < 0.3) { sighIdx = ts.k; cueCb && cueCb('turn', ts.k); }
      if (ts.k !== turnIdx && ts.p >= 0.3 && ts.p < 0.6) { turnIdx = ts.k; cueCb && cueCb('light', ts.k); }

      // ---- cloud (compositor) — always opaque so the moon never shows through ----
      const breathe = Math.sin(t * 2 * Math.PI / 5.4);
      let dx, dy, rot, sx, sy;
      if (reduced) { dx = -18 * L; dy = 0; rot = 0; sx = sy = 1; }
      else {
        dx = -138 * L + (1 - ent) * 46; dy = -10 * L + breathe * 2; rot = -5.5 * L + sh.sq * 0.8;
        sx = 1 + 0.012 * breathe + 0.03 * sh.sq; sy = 1 + 0.014 * breathe - 0.035 * sh.sq;
      }
      const ct = `translate3d(${(dx * k).toFixed(2)}px, ${(dy * k).toFixed(2)}px, 0) rotate(${rot.toFixed(3)}deg) scale(${sx.toFixed(4)}, ${sy.toFixed(4)})`;
      N.cloud.style.transform = ct; N.rim.style.transform = ct;
      const sc = sh.scrunch;
      set(N.eyeL, 'd', `M -104 ${(6 + 4 * sc).toFixed(1)} Q -78 ${(30 - 10 * sc).toFixed(1)} -52 ${(6 + 4 * sc).toFixed(1)}`);
      set(N.eyeR, 'd', `M 52 ${(6 + 4 * sc).toFixed(1)} Q 78 ${(30 - 10 * sc).toFixed(1)} 104 ${(6 + 4 * sc).toFixed(1)}`);
      set(N.mouth, 'ry', (9 * (1 - sc)).toFixed(1));
      set(N.smile, 'opacity', sc.toFixed(2));
      N.glow.style.opacity = (0.4 + 0.52 * L + 0.03 * Math.sin(t * 2 * Math.PI / 7) * m).toFixed(3);
      N.glow.style.transform = `scale(${(1 + 0.12 * L).toFixed(3)})`;
      N.rim.style.opacity = (0.35 + 0.65 * L).toFixed(3);
      N.bgc.style.transform = `translate3d(${(Math.sin(t / 21) * 30 * m * k).toFixed(2)}px, 0, 0)`;
      N.fol.style.transform = `rotate(${(Math.sin(t * 2 * Math.PI / 6.5) * 0.6 * m).toFixed(3)}deg)`;

      // ---- expressions follow the story beat: wonder while the light shows,
      //      a small "aww" (Luma) and a reassuring smile (Noura) right after it hides ----
      const wonder = M.smooth(0.3, 0.6, L);
      const after = ts.p < 0 && ts.since < 3.2 ? M.smooth(0, 0.4, ts.since) * (1 - M.smooth(2.6, 3.2, ts.since)) : 0;
      set(N.lm.fWonder, 'opacity', wonder.toFixed(2));
      set(N.lm.fAww, 'opacity', after.toFixed(2));
      set(N.lm.fSmile, 'opacity', Math.max(0, 1 - wonder - after).toFixed(2));
      set(N.nr.fGentle, 'opacity', after.toFixed(2));
      set(N.nr.fThink, 'opacity', (1 - after).toFixed(2));

      // ---- Luma: bouncy breathing, rises on tiptoe when the light shows ----
      const lb = Math.sin(t * 2 * Math.PI / 3.4);
      const look = M.easeOut(M.clamp((t - 0.3) / 1.6, 0, 1));
      set(N.lm.body, 'transform', `translate(0 ${(-7 * L * m - 1.6 * lb * m).toFixed(1)})`);
      set(N.lm.shadow, 'transform', `scale(${(1 - 0.08 * L * m).toFixed(3)} 1)`);
      set(N.lm.head, 'transform', `translate(0 ${(-7 * L * m - 2 * lb * m).toFixed(1)}) rotate(${(-5 + 3 * (1 - look) + Math.sin(t * 2 * Math.PI / 7.5) * 1.3 * m - 2 * L * m).toFixed(2)} 0 -250)`);
      set(N.lm.arm, 'transform', `rotate(${((1 - look) * -40 + Math.sin(t * 2 * Math.PI / 3.4 + 0.6) * 1.5 * m - 3 * L * m).toFixed(2)} -40 -214)`);
      const bl = blinkL(t);
      N.lm.eyes.forEach((e) => M.blink(e, bl, 0, -322, set));

      // ---- Noura: slow calm breathing, small attentive tilt ----
      const nb = Math.sin(t * 2 * Math.PI / 4.4 + 1), ny = (-1.4 * nb * m).toFixed(1);
      set(N.nr.body, 'transform', `translate(0 ${ny})`);
      set(N.nr.head, 'transform', `translate(0 ${ny}) rotate(${(-6 + 2 * (1 - look) + Math.sin(t * 2 * Math.PI / 9 + 2) * 1.0 * m - 1.5 * L * m).toFixed(2)} 0 -280)`);
      set(N.nr.arm, 'transform', `translate(0 ${ny})`);
      const bn = blinkN(t);
      N.nr.eyes.forEach((e) => M.blink(e, bn, 0, -347, set));
    }

    return { id: 'cloud', el, enter() { turnIdx = -1; sighIdx = -1; }, render, layout, onCue(cb) { cueCb = cb; }, audio: 'cloud', restFrameTime: 16 };
  }

  global.MidadScenes = global.MidadScenes || {};
  global.MidadScenes.cloud = { create, title: 'السر خلف الغيوم' };
})(window);

</script>
<script>

(function (global) {

  const layerLand = () => A.SVG('L-land', `

      <path d="M -400 1010 C 200 990 800 1000 1300 1016 C 1700 1030 2000 1006 2320 996 L 2320 1440 L -400 1440 Z" fill="${P.groundLow}"/>
      ${A.trunk(40, 960, 0.9, false)}

      <path d="M 1860 680 C 1850 642 1890 620 1918 636 C 1932 608 1980 608 1990 640 C 2020 634 2038 662 2026 684 Z" fill="${P.bush}"/>
      ${A.tuft(1180, 1040, 1.1)}${A.tuft(1880, 1010, 1.2, P.tuft2)}${A.tuft(300, 1050, 1.0, P.tuft2)}${A.tuft(1500, 1052, .9)}

  function create() {

    btnFs.setAttribute('aria-pressed', on);
    btnFs.setAttribute('aria-label', on ? 'الخروج من ملء الشاشة' : 'ملء الشاشة');
    btnFs.querySelector('.lbl').textContent = on ? 'خروج' : 'ملء الشاشة';
    stage.classList.toggle('is-fs', on);
    frame();
  }
  function toggleFullscreen(forceOn) {
    if (fsEl() && !forceOn) {
      (doc.exitFullscreen || doc.webkitExitFullscreen).call(doc);
      return;
    }
    if (fsEl()) return;
    if (!fsOK()) return toast('ملء الشاشة غير متاح هنا. اضغط F11 في المتصفح (أو ⌃⌘F على ماك).');
    const FAIL = 'تعذّر ملء الشاشة هنا. اضغط F11 في المتصفح (أو ⌃⌘F على ماك).';
    let failed = false;
    const fail = () => { if (!failed && !fsEl()) { failed = true; toast(FAIL); } };
    try {
      const req = stage.requestFullscreen || stage.webkitRequestFullscreen;
      const p = req.call(stage, { navigationUI: 'hide' });
      if (p && p.catch) p.catch(fail);
      // some embedded viewers ignore the request without rejecting it
      setTimeout(fail, 1200);
    } catch (e) { fail(); }
  }
  btnFs.addEventListener('click', () => toggleFullscreen(false));
  doc.addEventListener('fullscreenchange', syncFs);
  doc.addEventListener('webkitfullscreenchange', syncFs);

  /* ---------- sound controls ---------- */
  const btnMute = doc.getElementById('mute'), vol = doc.getElementById('vol');
  function syncSound() {
    btnMute.setAttribute('aria-pressed', audio.muted);
    btnMute.setAttribute('aria-label', audio.muted ? 'تشغيل الصوت' : 'كتم الصوت');
    btnMute.classList.toggle('off', audio.muted);
    vol.value = Math.round(audio.volume * 100);
    vol.setAttribute('aria-valuetext', `${arNum(Math.round(audio.volume * 100))}٪`);
  }
  btnMute.addEventListener('click', () => { audio.setMuted(!audio.muted); syncSound(); });
  vol.addEventListener('input', () => { audio.setVolume(vol.value / 100); if (audio.muted && vol.value > 0) audio.setMuted(false); syncSound(); });
  // return focus to the page after using the slider so a presenter clicker keeps navigating
  vol.addEventListener('pointerup', () => vol.blur());
  vol.addEventListener('change', () => setTimeout(() => vol.blur(), 0));
  syncSound();

  /* ---------- toast (outside the artwork) ---------- */
  const toastEl = doc.getElementById('toast'); let toastT = 0;
  function toast(msg) {
    toastEl.textContent = msg; toastEl.classList.add('on');
    clearTimeout(toastT); toastT = setTimeout(() => toastEl.classList.remove('on'), 6000);
    wake();
  }

  /* ---------- controls dim while narrating, return on any movement ---------- */
  let idleT = 0;
  function wake() {
    stage.classList.remove('idle');
    clearTimeout(idleT);
    idleT = setTimeout(() => {
      if (stage.querySelector('#controls:hover') || stage.querySelector('#controls :focus-visible')) return wake();
      stage.classList.add('idle');
    }, 2800);
  }
  ['pointermove', 'pointerdown', 'touchstart', 'wheel'].forEach((ev) => addEventListener(ev, wake, { passive: true }));

  /* ---------- keyboard ---------- */
  addEventListener('keydown', (e) => {
    wake();
    if (e.altKey || e.ctrlKey || e.metaKey) return;
    const tgt = e.target, tag = (tgt && tgt.tagName) || '';
    const onSlider = tag === 'INPUT';
    const k = e.key;
    // Space/Enter belong to the focused button only; never navigate on them.
    if (k === ' ' || k === 'Spacebar' || k === 'Enter') {
      if (!started && tag !== 'BUTTON') { e.preventDefault(); begin(false); }
      return;
    }
    if (e.repeat && /Arrow|Page/.test(k)) { e.preventDefault(); return; }
    let act = null;
    if (k === 'PageDown') act = 'next';
    else if (k === 'PageUp') act = 'prev';
    else if (!onSlider && (k === 'ArrowLeft' || k === 'ArrowDown')) act = 'next';   // RTL: forward is leftwards
    else if (!onSlider && (k === 'ArrowRight' || k === 'ArrowUp')) act = 'prev';
    else if (k === 'Home' && !onSlider) act = 'first';
    else if (k === 'End' && !onSlider) act = 'last';
    else if (k === 'f' || k === 'F' || k === 'ف') act = 'fs';
    else if (k === 'm' || k === 'M' || k === 'ة') act = 'mute';
    if (!act) return;
    e.preventDefault();
    if (act === 'next') next();
    else if (act === 'prev') prev();
    else if (act === 'first') started ? show(0) : begin(false);
    else if (act === 'last') started ? show(scenes.length - 1) : begin(false);
    else if (act === 'fs') toggleFullscreen(false);
    else if (act === 'mute') { if (!started) begin(false); audio.setMuted(!audio.muted); syncSound(); }
  });
  btnNext.addEventListener('click', next);
  btnPrev.addEventListener('click', prev);

  /* ---------- boot ---------- */
  doc.documentElement.classList.toggle('reduced', reduced);
  const want = PLAN.findIndex((p) => '#' + p.id === location.hash);
  frame();
  show(want >= 0 ? want : 0, true);
  syncFs();
  if (!fsOK()) doc.getElementById('startFs').hidden = true;
  // ?t=SECONDS renders a frozen frame of the scene without UI (review stills / backup images)
  if (params.has('t')) {
    const ft = parseFloat(params.get('t')) || 0;
    if (!params.has('ui')) stage.classList.add('still');
    gate.hidden = true; started = true; global.__midadFreeze = ft;
    scenes[cur].enter(); scenes[cur].render(ft, reduced);
  }
  raf = requestAnimationFrame(loop);
  wake();

  // test hooks (used by the review; harmless in normal use)
  global.__midad = {
    get index() { return cur; }, get started() { return started; }, scenes, audio, show, begin,
    sceneTime: () => (performance.now() - t0) / 1000,
    freeze(t) { global.__midadFreeze = t; const s = scenes[cur]; s.render(t, reduced); },
    unfreeze() { global.__midadFreeze = null; },
  };
})(window);

</script>
</body>
</html>
